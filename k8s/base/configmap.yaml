apiVersion: v1
kind: ConfigMap
metadata:
  name: microservicios-config
  namespace: microservicios
data:
  SERVICE_1_URL: http://service-1:8000
  SERVICE_TIMEOUT_MS: "5000"
  config.runtime.example.js: |
    globalThis.FRONTEND_CONFIG = {
      SERVICE_1_URL: "/api/service-1",
      SERVICE_2_URL: "/api/service-2",
      REQUEST_TIMEOUT_MS: 5000,
    };
