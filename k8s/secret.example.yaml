apiVersion: v1
kind: Secret
metadata:
  name: microservicios-secrets
  namespace: microservicios
type: Opaque
stringData:
  POSTGRES_DB: courts
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: replace-with-local-password
  DATABASE_URL: postgresql+psycopg://postgres:replace-with-local-password@postgres:5432/courts
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: replace-with-local-mongo-password
  MONGODB_URI: mongodb://admin:replace-with-local-mongo-password@mongodb:27017/reservations_service?authSource=admin
