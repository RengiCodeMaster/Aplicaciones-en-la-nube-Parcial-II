name: Build and deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: hola-mundo-demo
  ECR_REGISTRY: 901799140785.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Service 1
        working-directory: services/service-1
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
          pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Service 2 and frontend
        run: |
          npm ci --prefix services/service-2
          npm test --prefix services/service-2
          npm test --prefix frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-deploy

      - name: Ensure ECR repositories exist
        run: |
          for repository in courts-service reservations-service frontend; do
            aws ecr describe-repositories --repository-names "$repository" >/dev/null 2>&1 || \
              aws ecr create-repository --repository-name "$repository" --image-scanning-configuration scanOnPush=true >/dev/null
          done

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        run: |
          docker build -t "$ECR_REGISTRY/courts-service:$IMAGE_TAG" services/service-1
          docker build -t "$ECR_REGISTRY/reservations-service:$IMAGE_TAG" services/service-2
          docker build -t "$ECR_REGISTRY/frontend:$IMAGE_TAG" frontend
          docker push "$ECR_REGISTRY/courts-service:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/reservations-service:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/frontend:$IMAGE_TAG"

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Deploy application Secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        run: |
          kubectl create namespace microservicios --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n microservicios create secret generic microservicios-secrets \
            --from-literal=POSTGRES_DB=courts \
            --from-literal=POSTGRES_USER=postgres \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=DATABASE_URL="postgresql+psycopg://postgres:$POSTGRES_PASSWORD@postgres:5432/courts" \
            --from-literal=MONGO_INITDB_ROOT_USERNAME=admin \
            --from-literal=MONGO_INITDB_ROOT_PASSWORD="$MONGO_PASSWORD" \
            --from-literal=MONGODB_URI="mongodb://admin:$MONGO_PASSWORD@mongodb:27017/reservations_service?authSource=admin" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -k k8s/overlays/aws
          kubectl -n microservicios set image deployment/service-1 service-1="$ECR_REGISTRY/courts-service:$IMAGE_TAG"
          kubectl -n microservicios set image deployment/service-2 service-2="$ECR_REGISTRY/reservations-service:$IMAGE_TAG"
          kubectl -n microservicios set image deployment/frontend frontend="$ECR_REGISTRY/frontend:$IMAGE_TAG"

      - name: Verify rollout
        run: |
          kubectl -n microservicios rollout status deployment/postgres --timeout=300s
          kubectl -n microservicios rollout status deployment/mongodb --timeout=300s
          kubectl -n microservicios rollout status deployment/service-1 --timeout=300s
          kubectl -n microservicios rollout status deployment/service-2 --timeout=300s
          kubectl -n microservicios rollout status deployment/frontend --timeout=300s
          kubectl -n microservicios get pods,svc,pvc
